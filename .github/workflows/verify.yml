name: Verify website
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx astro check
      - name: Verify production routes in a container identical to production
        run: |
          docker run -d --name web --read-only --tmpfs /tmp --memory 256m --pids-limit 128 -u node -w /app \
            -v "$PWD/.output:/app/.output:ro" -e NODE_ENV=production -e HOST=0.0.0.0 -e PORT=3000 \
            -e RELEASE_SHA=ci -p 127.0.0.1:3100:3000 node:22-bookworm-slim node .output/server/index.mjs
          trap 'docker logs web; docker rm -f web' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3100/api/health > /dev/null; then break; fi
            sleep 1
          done
          npm run check:routes
