# Managed by the prohealthdigitalllc repository; independent of NPM database hosts.
server {
  listen 80;
  listen [::]:80;
  server_name prohealthdigitalllc.com www.prohealthdigitalllc.com;
  include conf.d/include/letsencrypt-acme-challenge.conf;
  location / { return 301 https://prohealthdigitalllc.com$request_uri; }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name prohealthdigitalllc.com www.prohealthdigitalllc.com;
  ssl_certificate /etc/letsencrypt/live/prohealthdigitalllc.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/prohealthdigitalllc.com/privkey.pem;
  include conf.d/include/ssl-cache.conf;
  include conf.d/include/ssl-ciphers.conf;
  if ($host = www.prohealthdigitalllc.com) { return 301 https://prohealthdigitalllc.com$request_uri; }
  access_log /data/logs/prohealth_access.log proxy;
  error_log /data/logs/prohealth_error.log warn;
  client_max_body_size 16k;
  location / {
    proxy_pass http://prohealth-web:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    # Render this placeholder from private proxy.env during deployment; never commit its value.
    proxy_set_header X-ProHealth-Proxy-Token __PROHEALTH_PROXY_TOKEN__;
  }
}
